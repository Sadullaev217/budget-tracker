<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Budget Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  // Apply the saved/system theme before first paint so there's no light-to-dark flash.
  (function(){
    var theme = 'light';
    try{
      var saved = localStorage.getItem('ledger-theme');
      theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }catch(e){}
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Loading…</div>
</div>

<div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

<!-- ?v= keeps lib.js and app.js in step after a deploy (Pages caches assets for 10 min). Bump on release. -->
<script src="lib.js?v=10"></script>
<script src="app.js?v=10"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>

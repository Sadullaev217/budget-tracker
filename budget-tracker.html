<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Budget Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --surface-2: #F1F3F6;
    --surface-3: #E8ECF1;
    --text: #0F172A;
    --text-dim: #475569;
    --text-dimmer: #94A3B8;
    --navy: #0F172A;
    --navy-light: #1E3A8A;
    --gold: #A16207;
    --gold-soft: #D97706;
    --income: #059669;
    --income-bg: rgba(5,150,105,0.1);
    --expense: #DC2626;
    --expense-bg: rgba(220,38,38,0.1);
    --border: #E2E8F0;
    --radius: 24px;
    --radius-sm: 14px;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
  }

  :root[data-theme="dark"]{
    --bg: #0B1220;
    --surface: #131B2E;
    --surface-2: #1B2438;
    --surface-3: #232E47;
    --text: #E2E8F0;
    --text-dim: #94A3B8;
    --text-dimmer: #64748B;
    --navy: #2563EB;
    --navy-light: #3B82F6;
    --gold: #FBBF24;
    --gold-soft: #F59E0B;
    --income: #34D399;
    --income-bg: rgba(52,211,153,0.15);
    --expense: #F87171;
    --expense-bg: rgba(248,113,113,0.15);
    --border: rgba(255,255,255,0.08);
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.3);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
    transition: background-color .2s ease, color .2s ease;
  }

  .app{ max-width: 900px; margin: 0 auto; }

  /* Header */
  .header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 20px;
    margin-bottom: 20px;
  }
  .header h1{
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    margin: 0;
    letter-spacing: -0.02em;
    color: var(--navy);
  }
  .header .tagline{
    color: var(--text-dimmer);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  .header .today{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dimmer);
    text-align: right;
  }
  .header-actions{ display:flex; align-items:center; gap: 12px; }

  .theme-toggle{
    width: 40px; height: 40px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-dim);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    flex-shrink: 0;
  }
  .theme-toggle:hover{ color: var(--navy); border-color: var(--navy); }
  .theme-toggle svg{ width: 18px; height: 18px; }

  /* Tabs — segmented pill control */
  .tabs{
    display:flex;
    gap: 2px;
    margin-bottom: 20px;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 4px;
    width: fit-content;
  }
  .tab{
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 999px;
    transition: color .15s, background .15s;
  }
  .tab:hover{ color: var(--text); }
  .tab.active{ color: #fff; background: var(--navy); font-weight: 600; }

  .panel{ display:none; }
  .panel.active{ display:block; animation: fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }

  /* Bento grid — Overview */
  .bento-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-areas:
      "balance balance income expense"
      "balance balance categories categories"
      "chart chart chart chart"
      "goals goals goals goals";
    gap: 16px;
    margin-bottom: 18px;
  }
  .tile{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  @media (hover: hover){
    .tile:hover{ transform: scale(1.015); box-shadow: 0 4px 8px rgba(15,23,42,0.06), 0 16px 32px rgba(15,23,42,0.09); }
  }
  .tile-balance{ grid-area: balance; display:flex; flex-direction:column; justify-content:center; }
  .tile-income{ grid-area: income; }
  .tile-expense{ grid-area: expense; }
  .tile-categories{ grid-area: categories; }
  .tile-chart{ grid-area: chart; position: relative; }
  .tile-goals{ grid-area: goals; }

  .tile-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dimmer);
    margin-bottom: 8px;
  }
  .tile-amount{
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 2.4rem;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .tile-amount.negative{ color: var(--expense); }
  .tile-amount.positive{ color: var(--navy); }
  .tile-income .tile-amount{ font-size: 1.5rem; color: var(--income); }
  .tile-expense .tile-amount{ font-size: 1.5rem; color: var(--expense); }

  .tile h2{
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--text);
  }

  /* Cards (Transactions / Goals tabs) */
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .card h2{
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 16px;
    color: var(--text);
  }

  /* Category / goal progress rows */
  .cat-row{ margin-bottom: 14px; }
  .cat-row:last-child{ margin-bottom: 0; }
  .cat-row .cat-top{
    display:flex; justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
  .cat-top .amt{ font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: var(--text-dim); }
  .bar-track{
    height: 8px;
    background: var(--surface-3);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    border-radius: 999px;
    transition: width .3s;
  }
  .bar-fill.navy{ background: linear-gradient(90deg, var(--navy-light), var(--navy)); }
  .bar-fill.gold{ background: linear-gradient(90deg, var(--gold-soft), var(--gold)); }

  /* Monthly expense chart */
  .chart-wrap{ width: 100%; }
  .chart-svg{ width: 100%; height: auto; display:block; overflow: visible; }
  .chart-bar{ fill: var(--expense); transition: fill-opacity .15s; }
  .chart-hit{ fill: transparent; cursor: pointer; }
  .chart-bar-group:hover .chart-bar,
  .chart-bar-group:focus-within .chart-bar{ fill-opacity: 0.8; }
  .chart-hit:focus-visible{ outline: 2px solid var(--navy-light); outline-offset: -2px; }
  .chart-axis-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    fill: var(--text-dimmer);
  }
  .chart-value-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    fill: var(--text-dim);
  }
  .chart-baseline{ stroke: var(--border); stroke-width: 1; }
  .chart-tooltip{
    position: absolute;
    pointer-events: none;
    background: var(--navy);
    color: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    transform: translate(-50%, -100%);
    opacity: 0;
    transition: opacity .12s ease;
    z-index: 10;
  }
  .chart-tooltip .val{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }
  .chart-tooltip.visible{ opacity: 1; }

  .empty{
    color: var(--text-dimmer);
    font-size: 0.85rem;
    padding: 8px 0;
  }

  /* Forms */
  .form-row{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .field{ flex: 1; min-width: 110px; display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dimmer);
    font-family: 'IBM Plex Mono', monospace;
  }
  input, select{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  input:focus, select:focus{ border-color: var(--navy); background: var(--surface); }
  input::placeholder{ color: var(--text-dimmer); }

  .toggle-group{ display:flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow:hidden; background: var(--surface-2); }
  .toggle-btn{
    flex:1;
    background: none;
    border:none;
    color: var(--text-dim);
    padding: 10px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    transition: background .15s, color .15s;
  }
  .toggle-btn.active.income{ background: var(--income); color: #fff; font-weight:600; }
  .toggle-btn.active.expense{ background: var(--expense); color: #fff; font-weight:600; }

  .btn{
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 11px 20px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    transition: background .15s, transform .15s;
  }
  .btn:hover{ background: var(--navy-light); }
  .btn:active{ transform: scale(0.98); }
  .btn:focus-visible, .tab:focus-visible, .toggle-btn:focus-visible, input:focus-visible, select:focus-visible{
    outline: 2px solid var(--navy-light);
    outline-offset: 2px;
  }
  .btn.ghost{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn.ghost:hover{ border-color: var(--navy); color: var(--navy); background: var(--surface-2); }

  /* Transaction list */
  .ledger-month{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-dimmer);
    margin: 18px 0 8px;
  }
  .ledger-month:first-child{ margin-top: 0; }
  .ledger-line{
    display:flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .ledger-line:last-child{ border-bottom: none; }
  .ledger-line .info{ display:flex; flex-direction:column; gap: 2px; min-width:0; }
  .ledger-line .desc{
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ledger-line .cat-tag{
    font-size: 0.72rem;
    color: var(--text-dimmer);
  }
  .ledger-line .right{ display:flex; align-items:center; gap: 8px; flex-shrink:0; }
  .ledger-line .amt{
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .ledger-line .amt.income{ color: var(--income); background: var(--income-bg); }
  .ledger-line .amt.expense{ color: var(--expense); background: var(--expense-bg); }
  .del{
    background:none; border:none; color: var(--text-dimmer);
    cursor:pointer; font-size: 0.85rem; padding: 4px;
    border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .del:hover{ color: var(--expense); background: var(--expense-bg); }

  .total-line{
    display:flex;
    justify-content: space-between;
    padding-top: 14px;
    margin-top: 8px;
    border-top: 2px solid var(--navy);
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 0.95rem;
  }

  /* Goals */
  .goal-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .goal-card{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 18px 20px;
    transition: transform .2s ease;
  }
  @media (hover: hover){
    .goal-card:hover{ transform: scale(1.015); }
  }
  .goal-top{ display:flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .goal-name{ font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 1rem; }
  .goal-nums{ font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--text-dim); }
  .goal-nums .target{ color: var(--text-dimmer); }
  .goal-actions{ display:flex; gap: 8px; margin-top: 14px; align-items:center; }
  .goal-actions input{ width: 110px; }
  .goal-pct{ font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--gold); margin-top: 6px; }

  /* Daily calendar */
  .cal-nav{
    display:flex; align-items:center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-nav-btns{ display:flex; align-items:center; gap: 8px; }
  .cal-nav button{
    width: 32px; height: 32px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1rem;
    transition: border-color .15s, color .15s;
  }
  .cal-nav button:hover{ border-color: var(--navy); color: var(--navy); }
  .cal-nav .cal-today-btn{ width: auto; padding: 0 12px; font-size: 0.75rem; font-weight: 600; }
  .cal-label{ font-weight: 600; font-size: 1rem; }
  .calendar-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-weekday{
    text-align:center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-dimmer);
    padding-bottom: 6px;
  }
  .day-cell{
    aspect-ratio: 1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .day-cell:hover{ border-color: var(--navy); }
  .day-cell.today{ border-color: var(--gold); border-width: 2px; font-weight: 600; }
  .day-cell.selected{ background: var(--navy); color: #fff; border-color: var(--navy); }
  .day-cell.empty{ visibility: hidden; pointer-events: none; }
  .day-dots{ display:flex; gap: 3px; height: 6px; }
  .day-dot{ width: 5px; height: 5px; border-radius: 50%; }
  .day-dot.income{ background: var(--income); }
  .day-dot.expense{ background: var(--expense); }
  .day-cell.selected .day-dot{ box-shadow: 0 0 0 1px rgba(255,255,255,0.6); }

  .day-detail-title{
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .day-detail-sub{
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .day-detail-sub .net-positive{ color: var(--income); }
  .day-detail-sub .net-negative{ color: var(--expense); }

  .loading{ text-align:center; color: var(--text-dimmer); padding: 40px 0; }

  /* Auth screen */
  .auth-wrap{
    min-height: 80vh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
  }
  .auth-card{
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px 24px;
  }
  .auth-card-top{ display:flex; justify-content:flex-end; margin-bottom: 4px; }
  .auth-title{
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    text-align:center;
    color: var(--navy);
    margin: 0;
    letter-spacing: -0.02em;
  }
  .auth-tagline{
    text-align:center;
    color: var(--text-dimmer);
    font-size: 0.82rem;
    margin: 6px 0 22px;
  }
  .auth-tabs{ width: 100%; margin-bottom: 20px; }
  .auth-tabs .tab{ flex:1; text-align:center; }
  .auth-error{
    color: var(--expense);
    background: var(--expense-bg);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    margin: -4px 0 14px;
  }
  .auth-note{
    text-align:center;
    color: var(--text-dimmer);
    font-size: 0.72rem;
    margin-top: 18px;
    line-height: 1.5;
  }
  .signed-in-as{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dimmer);
    text-align: right;
    margin-top: 3px;
  }
  .signed-in-as strong{ color: var(--text-dim); font-weight: 600; }

  @media (max-width: 640px){
    .bento-grid{
      grid-template-columns: 1fr;
      grid-template-areas:
        "balance"
        "income"
        "expense"
        "categories"
        "chart"
        "goals";
    }
    .goal-grid{ grid-template-columns: 1fr; }
  }
  @media (max-width: 480px){
    .tile-amount{ font-size: 1.9rem; }
    .header{ flex-direction: column; align-items: flex-start; gap: 6px; }
    .header .today{ text-align: left; }
    .calendar-grid{ gap: 4px; }
    .day-cell{ font-size: 0.7rem; border-radius: 8px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Loading…</div>
</div>

<script>
const STORAGE_PREFIX = 'ledger-data-v1';
const USERS_KEY = 'ledger-users';
const SESSION_KEY = 'ledger-current-user';
const EXPENSE_CATS = ['Food','Housing','Transport','Utilities','Entertainment','Health','Other'];
const INCOME_CATS = ['Salary','Freelance','Gift','Other'];

let state = { transactions: [], goals: [] };
let activeTab = 'overview';
let txType = 'expense';
let dailyType = 'expense';

let currentUser = null;
let authMode = 'signin';
let authError = '';

const TODAY_ISO = new Date().toISOString().slice(0,10);
let selectedDate = TODAY_ISO;
let calYear = new Date().getFullYear();
let calMonthIdx = new Date().getMonth();

const THEME_KEY = 'ledger-theme';
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  render();
}

const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"></path></svg>';

function fmt(n){
  const neg = n < 0;
  const v = Math.abs(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg ? '-' : '') + '$' + v;
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function hashPassword(pw){
  if(window.crypto && window.crypto.subtle){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }catch(e){ /* fall through to non-crypto fallback below */ }
  }
  let h = 0;
  for(let i = 0; i < pw.length; i++){ h = (Math.imul(31, h) + pw.charCodeAt(i)) | 0; }
  return 'fallback:' + h.toString(16);
}

function getUsers(){
  try{ return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }catch(e){ return {}; }
}
function saveUsers(users){
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}
function userStorageKey(username){ return `${STORAGE_PREFIX}:${username}`; }

async function signIn(username, password){
  username = username.trim();
  authError = '';
  const users = getUsers();
  const rec = users[username];
  if(!username || !rec){ authError = 'No account found with that username.'; render(); return; }
  const hash = await hashPassword(password);
  if(hash !== rec.passwordHash){ authError = 'Incorrect password.'; render(); return; }
  currentUser = username;
  localStorage.setItem(SESSION_KEY, username);
  loadUserData();
  render();
}

async function signUp(username, password, confirm){
  username = username.trim();
  authError = '';
  if(!username){ authError = 'Enter a username.'; render(); return; }
  if(password.length < 4){ authError = 'Password must be at least 4 characters.'; render(); return; }
  if(password !== confirm){ authError = 'Passwords do not match.'; render(); return; }
  const users = getUsers();
  if(users[username]){ authError = 'That username is already taken.'; render(); return; }
  users[username] = { passwordHash: await hashPassword(password) };
  saveUsers(users);
  currentUser = username;
  localStorage.setItem(SESSION_KEY, username);
  loadUserData();
  render();
}

function signOut(){
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
  state = { transactions: [], goals: [] };
  activeTab = 'overview';
  authMode = 'signin';
  authError = '';
  render();
}

function loadUserData(){
  state = { transactions: [], goals: [] };
  try{
    const raw = localStorage.getItem(userStorageKey(currentUser));
    if(raw){
      state = JSON.parse(raw);
      state.transactions = state.transactions || [];
      state.goals = state.goals || [];
    }
  }catch(e){
    // no existing data yet
  }
}

function restoreSession(){
  const saved = localStorage.getItem(SESSION_KEY);
  if(saved){
    currentUser = saved;
    loadUserData();
  }
  render();
}

function save(){
  if(!currentUser) return;
  try{
    localStorage.setItem(userStorageKey(currentUser), JSON.stringify(state));
  }catch(e){
    console.error('Could not save ledger data', e);
  }
}

function addTransaction(data){
  state.transactions.unshift({ id: uid(), ...data });
  save(); render();
}
function deleteTransaction(id){
  state.transactions = state.transactions.filter(t => t.id !== id);
  save(); render();
}
function addGoal(data){
  state.goals.push({ id: uid(), saved: 0, ...data });
  save(); render();
}
function deleteGoal(id){
  state.goals = state.goals.filter(g => g.id !== id);
  save(); render();
}
function contributeToGoal(id, amount){
  const g = state.goals.find(g => g.id === id);
  if(g){ g.saved = Math.max(0, g.saved + amount); save(); render(); }
}

function totals(){
  let income = 0, expense = 0;
  const byCategory = {};
  state.transactions.forEach(t => {
    if(t.type === 'income') income += t.amount;
    else {
      expense += t.amount;
      byCategory[t.category] = (byCategory[t.category] || 0) + t.amount;
    }
  });
  return { income, expense, balance: income - expense, byCategory };
}

function monthKey(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleString(undefined, { month: 'long', year: 'numeric' });
}

function pad2(n){ return String(n).padStart(2, '0'); }

function transactionsForDate(dateStr){
  return state.transactions.filter(tx => tx.date === dateStr);
}

function dayTotals(dateStr){
  let income = 0, expense = 0;
  transactionsForDate(dateStr).forEach(tx => {
    if(tx.type === 'income') income += tx.amount; else expense += tx.amount;
  });
  return { income, expense, net: income - expense };
}

function shiftCalendar(delta){
  calMonthIdx += delta;
  if(calMonthIdx < 0){ calMonthIdx = 11; calYear--; }
  if(calMonthIdx > 11){ calMonthIdx = 0; calYear++; }
  render();
}

function goToToday(){
  const d = new Date();
  calYear = d.getFullYear();
  calMonthIdx = d.getMonth();
  selectedDate = TODAY_ISO;
  render();
}

function monthlyExpenseSeries(){
  const buckets = {};
  state.transactions.forEach(tx => {
    if(tx.type !== 'expense') return;
    const d = new Date(tx.date + 'T00:00:00');
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    buckets[key] = (buckets[key] || 0) + tx.amount;
  });
  const keys = Object.keys(buckets).sort();
  const recent = keys.slice(-6);
  const years = new Set(recent.map(k => k.slice(0,4)));
  return recent.map(key => {
    const [y, m] = key.split('-').map(Number);
    const d = new Date(y, m-1, 1);
    const label = years.size > 1
      ? d.toLocaleString(undefined, { month: 'short', year: '2-digit' })
      : d.toLocaleString(undefined, { month: 'short' });
    return { key, label, total: buckets[key] };
  });
}

function renderChart(series){
  if(!series.length){
    return `<h2>Expenses by month</h2><div class="empty">No expenses logged yet. Add one from the Transactions tab.</div>`;
  }
  const W = 640, H = 180;
  const padTop = 24, padBottom = 24, padSide = 8;
  const plotW = W - padSide*2;
  const plotH = H - padTop - padBottom;
  const max = Math.max(...series.map(s => s.total), 1);
  const n = series.length;
  const slot = plotW / n;
  const barW = Math.min(28, slot * 0.5);
  const baselineY = H - padBottom;

  const bars = series.map((s, i) => {
    const cx = padSide + slot * i + slot / 2;
    const x = cx - barW / 2;
    const h = max > 0 ? (s.total / max) * plotH : 0;
    const y = baselineY - h;
    const r = Math.min(4, h);
    const path = h > 0
      ? `M${x},${baselineY} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+barW-r},${y} Q${x+barW},${y} ${x+barW},${y+r} L${x+barW},${baselineY} Z`
      : `M${x},${baselineY} L${x+barW},${baselineY}`;
    const valueText = fmt(s.total);
    return `
      <g class="chart-bar-group" tabindex="0" role="img" aria-label="${s.label}: ${valueText}" data-month="${s.label}" data-value="${valueText}" data-cx="${cx}" data-top="${y}">
        <text class="chart-value-label" x="${cx}" y="${Math.max(y-6, 10)}" text-anchor="middle">${valueText}</text>
        <path class="chart-bar" d="${path}"></path>
        <text class="chart-axis-label" x="${cx}" y="${H-6}" text-anchor="middle">${s.label}</text>
        <rect class="chart-hit" x="${padSide + slot*i}" y="${padTop}" width="${slot}" height="${plotH+padBottom}"></rect>
      </g>
    `;
  }).join('');

  return `
    <h2>Expenses by month</h2>
    <div class="chart-wrap">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <line class="chart-baseline" x1="${padSide}" y1="${baselineY}" x2="${W-padSide}" y2="${baselineY}"></line>
        ${bars}
      </svg>
      <div class="chart-tooltip" id="chart-tooltip"></div>
    </div>
  `;
}

function renderDaily(){
  const monthLabel = new Date(calYear, calMonthIdx, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' });
  const firstWeekday = new Date(calYear, calMonthIdx, 1).getDay();
  const numDays = new Date(calYear, calMonthIdx + 1, 0).getDate();
  const weekdayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const weekdayHeaders = weekdayNames.map(w => `<div class="cal-weekday">${w}</div>`).join('');
  const leadingBlanks = Array.from({ length: firstWeekday }, () => `<div class="day-cell empty"></div>`).join('');

  const dayCells = Array.from({ length: numDays }, (_, i) => {
    const day = i + 1;
    const dateStr = `${calYear}-${pad2(calMonthIdx + 1)}-${pad2(day)}`;
    const dt = dayTotals(dateStr);
    const isToday = dateStr === TODAY_ISO;
    const isSelected = dateStr === selectedDate;
    const dots = (dt.income > 0 ? '<span class="day-dot income"></span>' : '') +
                 (dt.expense > 0 ? '<span class="day-dot expense"></span>' : '');
    return `
      <button type="button" class="day-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-date="${dateStr}" aria-label="${dateStr}">
        <span class="day-num">${day}</span>
        <span class="day-dots">${dots}</span>
      </button>
    `;
  }).join('');

  const selectedEntries = transactionsForDate(selectedDate).slice().sort((a,b) => a.id < b.id ? 1 : -1);
  const selDt = dayTotals(selectedDate);
  const selLabel = new Date(selectedDate + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const netClass = selDt.net > 0 ? 'net-positive' : (selDt.net < 0 ? 'net-negative' : '');

  const entryLines = selectedEntries.length ? selectedEntries.map(tx => `
    <div class="ledger-line">

  const cats = dailyType === 'income' ? INCOME_CATS : EXPENSE_CATS;
  const catOptions = cats.map(c => `<option value="${c}">${c}</option>`).join('');

  return `
    <div class="card">
      <div class="cal-nav">
        <div class="cal-label">${monthLabel}</div>
        <div class="cal-nav-btns">
          <button type="button" class="cal-today-btn" data-cal-today aria-label="Jump to today">Today</button>
          <button type="button" data-cal-nav="-1" aria-label="Previous month">‹</button>
          <button type="button" data-cal-nav="1" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="calendar-grid">
        ${weekdayHeaders}
        ${leadingBlanks}
        ${dayCells}
      </div>
    </div>
    <div class="card">
      <div class="day-detail-title">${selLabel}</div>
      <div class="day-detail-sub">Income ${fmt(selDt.income)} &nbsp;·&nbsp; Expenses ${fmt(selDt.expense)} &nbsp;·&nbsp; Net <span class="${netClass}">${fmt(selDt.net)}</span></div>
      ${entryLines}
    </div>
    <div class="card">
      <h2>Add entry for this day</h2>
      <div class="form-row">
        <div class="field" style="flex: 0 0 160px;">
          <label>Type</label>
          <div class="toggle-group">
            <button type="button" class="toggle-btn expense ${dailyType==='expense'?'active':''}" data-dtype="expense">Expense</button>
            <button type="button" class="toggle-btn income ${dailyType==='income'?'active':''}" data-dtype="income">Income</button>
          </div>
        </div>
        <div class="field">
          <label>Amount</label>
          <input type="number" id="daily-amount" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="field">

          <select id="daily-category">${catOptions}</select>
        </div>
      </div>
      <div class="form-row">
        <div class="field" style="flex: 3;">
          <label>Note (optional)</label>
          <input type="text" id="daily-note" placeholder="e.g. groceries at the market">
        </div>
      </div>
      <button class="btn" id="add-daily-tx-btn">Add entry</button>
    </div>
  `;
}

function attachAuthHandlers(){
  const themeBtn = document.getElementById('theme-toggle');
  if(themeBtn) themeBtn.addEventListener('click', toggleTheme);

  document.querySelectorAll('[data-authmode]').forEach(btn => {
    btn.addEventListener('click', () => { authMode = btn.dataset.authmode; authError = ''; render(); });
  });

  const form = document.getElementById('auth-form');
  if(form){
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('auth-username').value;
      const password = document.getElementById('auth-password').value;
      if(authMode === 'signup'){
        const confirm = document.getElementById('auth-password-confirm').value;
        signUp(username, password, confirm);
      } else {
        signIn(username, password);
      }
    });
  }
}

function attachPanelHandlers(t){
  // Monthly expense chart
  const barGroups = document.querySelectorAll('.chart-bar-group');
  if(barGroups.length){
    const svg = document.querySelector('.chart-svg');
    const wrap = document.querySelector('.chart-wrap');
    const tooltip = document.getElementById('chart-tooltip');
    const showTip = (g) => {
      const svgRect = svg.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const scaleX = svgRect.width / 640;
      const scaleY = svgRect.height / 180;
      const px = (svgRect.left - wrapRect.left) + parseFloat(g.dataset.cx) * scaleX;
      const py = (svgRect.top - wrapRect.top) + parseFloat(g.dataset.top) * scaleY;
      tooltip.innerHTML = '';
      tooltip.appendChild(document.createTextNode(g.dataset.month + ' — '));
      const val = document.createElement('span');
      val.className = 'val';
      val.textContent = g.dataset.value;
      tooltip.appendChild(val);
      tooltip.style.left = px + 'px';
      tooltip.style.top = (py - 8) + 'px';
      tooltip.classList.add('visible');
    };
    const hideTip = () => tooltip.classList.remove('visible');
    barGroups.forEach(g => {
      g.addEventListener('pointerenter', () => showTip(g));
      g.addEventListener('pointerleave', hideTip);
      g.addEventListener('focus', () => showTip(g));
      g.addEventListener('blur', hideTip);
    });
  }

  // Daily calendar panel
  document.querySelectorAll('[data-cal-nav]').forEach(btn => {
    btn.addEventListener('click', () => shiftCalendar(parseInt(btn.dataset.calNav, 10)));
  });
  const calTodayBtn = document.querySelector('[data-cal-today]');
  if(calTodayBtn) calTodayBtn.addEventListener('click', goToToday);
  document.querySelectorAll('.day-cell[data-date]').forEach(btn => {
    btn.addEventListener('click', () => { selectedDate = btn.dataset.date; render(); });
  });
  document.querySelectorAll('.toggle-btn[data-dtype]').forEach(btn => {
    btn.addEventListener('click', () => { dailyType = btn.dataset.dtype; render(); });
  });
  const addDailyTxBtn = document.getElementById('add-daily-tx-btn');
  if(addDailyTxBtn){
    addDailyTxBtn.addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('daily-amount').value);
      const category = document.getElementById('daily-category').value;
      const note = document.getElementById('daily-note').value.trim();
      if(!amount || amount <= 0){ return; }
      addTransaction({ type: dailyType, amount, category, date: selectedDate, note });
    });
  }

  // Transactions panel
  document.querySelectorAll('.toggle-btn[data-type]').forEach(btn => {
    btn.addEventListener('click', () => { txType = btn.dataset.type; render(); });
  });
  const addTxBtn = document.getElementById('add-tx-btn');
  if(addTxBtn){
    addTxBtn.addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const category = document.getElementById('tx-category').value;
      const date = document.getElementById('tx-date').value || new Date().toISOString().slice(0,10);
      const note = document.getElementById('tx-note').value.trim();
      if(!amount || amount <= 0){ return; }
      addTransaction({ type: txType, amount, category, date, note });
    });
  }
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => deleteTransaction(btn.dataset.del));
  });

  // Goals panel
  const addGoalBtn = document.getElementById('add-goal-btn');
  if(addGoalBtn){
    addGoalBtn.addEventListener('click', () => {
      const name = document.getElementById('goal-name').value.trim();
      const target = parseFloat(document.getElementById('goal-target').value);
      if(!name || !target || target <= 0){ return; }
      addGoal({ name, target });
    });
  }
  document.querySelectorAll('[data-delgoal]').forEach(btn => {
    btn.addEventListener('click', () => deleteGoal(btn.dataset.delgoal));
  });
  document.querySelectorAll('[data-contribute]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.contribute;
      const input = document.getElementById(`contrib-${id}`);
      const amount = parseFloat(input.value);
      if(!amount || amount <= 0) return;
      contributeToGoal(id, amount);
    });
  });
}

initTheme();
restoreSession();
</script>
</body>
</html>
